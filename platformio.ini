; ESP-KVM — wireless macro deck + trackpad
; Two build environments in one project:
;   env:dongle     -> LilyGO T-Dongle S3  (USB-HID device plugged into the PC)
;   env:controller -> M5Stack CoreS3       (LVGL touchscreen remote)
;
; Uses the pioarduino platform fork because it ships arduino-esp32 3.x, which the
; ESP32-S3 native-USB stack and M5Unified both require (stock espressif32 lags at 2.x).

[platformio]
default_envs = dongle, controller, paper, core2, stickc
src_dir = src

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
  -I src
  -I lib/espkvm_proto
  -DCORE_DEBUG_LEVEL=3

; ---------------------------------------------------------------------------
; Dongle — LilyGO T-Dongle S3
; Native USB in TinyUSB (OTG) mode so it can enumerate as a keyboard/mouse.
; The board JSON defines ARDUINO_USB_MODE=1; we undefine then redefine to 0
; (TinyUSB/OTG) to avoid "redefined" warnings, and disable the USB serial console.
; Flash via BOOT-button download mode (hold BOOT while plugging in / resetting).
; NOTE: memory_type assumes the N16R8 module (16MB flash / 8MB OPI PSRAM). If the
;       board boot-loops after flashing, remove the memory_type line and re-flash.
; ---------------------------------------------------------------------------
[env:dongle]
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_src_filter = +<common/> +<dongle/>
; Strip the board's USB_MODE=1 so our TinyUSB/OTG value below actually wins.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; bundled USB library's USBHostMSC pulls in FS.h without declaring the dep
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
lib_deps =
  lovyan03/LovyanGFX@^1.1.16

; ---------------------------------------------------------------------------
; Controller — M5Stack CoreS3
; M5Unified drives the ILI9342C display, FT6336 touch, and the AXP2101/AW9523
; power + IO expanders. LVGL is layered on in Phase 4.
; ---------------------------------------------------------------------------
[env:controller]
board = m5stack-cores3
build_src_filter = +<common/> +<controller/>
build_flags =
  ${env.build_flags}
  -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  m5stack/M5Unified@^0.2.2
  lvgl/lvgl@8.4.0

; ---------------------------------------------------------------------------
; M5Paper (original, ESP32) — ambient e-ink legend + action log.
; Listens for ANNOUNCE packets and renders the current profile's button map and
; a log of fired macros. Flashes normally over its CH9102 UART (auto-reset).
; ---------------------------------------------------------------------------
[env:paper]
board = m5stack_paper
build_src_filter = +<common/> +<paper/>
lib_deps =
  m5stack/M5Unified@^0.2.2

; ---------------------------------------------------------------------------
; Core2 — "Guard" bridge to the M5Stack UnitV2 AI camera.
; Reads the UnitV2's JSON detections over PORT.A UART (grove) and fires ESP-NOW
; macros (presence-aware auto-lock). Flashes normally over USB-C.
; ---------------------------------------------------------------------------
[env:core2]
board = m5stack-core2
build_src_filter = +<common/> +<core2/>
lib_deps =
  m5stack/M5Unified@^0.2.2
  bblanchon/ArduinoJson@^7.1.0

; ---------------------------------------------------------------------------
; M5StickC Plus2 — ambient RAM meter on an SK6812 flex strip.
; Tethered to the Mac over USB; a host script streams "R<used%>" lines (see
; tools/ram-meter.sh). Drives the strip as a green->amber->red progress bar.
; Tune RAM_LEDS / RAM_DATA_PIN to your strip/wiring.
; ---------------------------------------------------------------------------
[env:stickc]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = +<common/> +<stickc/>
build_flags =
  ${env.build_flags}
  -DRAM_LEDS=30
  -DRAM_DATA_PIN=32
  -DIR_TX_PIN=19
  -D_IR_ENABLE_DEFAULT_=false
  -DSEND_SHARP=true
lib_deps =
  m5stack/M5Unified@^0.2.2
  adafruit/Adafruit NeoPixel@^1.12.3
  crankyoldgit/IRremoteESP8266@^2.8.6
